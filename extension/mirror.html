<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sable mirror</title>
    <link rel="stylesheet" href="stage.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="mark">Screen mirror</p>
        <h1>Share a window, tab, or the whole screen</h1>
      </div>
    </header>
    <video id="stage" autoplay muted playsinline></video>
    <main>
      <button id="go" type="button">Choose what to mirror</button>
      <p class="hint">Put this window on the display you want to watch. Audio plays here. DRM pages still cannot be copied out of their player.</p>
    </main>
    <script src="mirror.js"></script>
  </body>
</html>
